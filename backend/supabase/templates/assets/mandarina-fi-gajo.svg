    <!-- cáscara (peel) -->
    <path d="M 103.2 42.3 A 46 46 0 0 1 16.8 42.3 L 60 86 Z" fill="#ea580c" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
    <!-- albedo (pith) -->
    <path d="M 99.2 43.8 A 42 42 0 0 1 20.8 43.8 L 60 86 Z" fill="#fff7ed"/>
    <!-- pulpa (flesh) -->
    <path d="M 94.9 45.4 A 36 36 0 0 1 25.1 45.4 L 60 86 Z" fill="#f97316"/>
    <!-- vesículas de jugo -->
    <ellipse cx="60" cy="52" rx="4.2" ry="7.5" fill="#fdba74"/>
    <ellipse cx="69.5" cy="55" rx="3.6" ry="6.4" fill="#fdba74" transform="rotate(-22 69.5 55)"/>
    <ellipse cx="50.5" cy="55" rx="3.6" ry="6.4" fill="#fdba74" transform="rotate(22 50.5 55)"/>
    <ellipse cx="76" cy="63" rx="3" ry="5.4" fill="#fdba74" transform="rotate(-42 76 63)"/>
    <ellipse cx="44" cy="63" rx="3" ry="5.4" fill="#fdba74" transform="rotate(42 44 63)"/>
    <ellipse cx="60" cy="67" rx="3.4" ry="6" fill="#fdba74"/>
  </g>
</svg>
